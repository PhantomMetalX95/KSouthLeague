box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0a1233;--card:#121e52;--tx:#eef2ff;--mut:#9aa7d6;--line:#26346f;--acc:#7fd4ff}}
:root[data-theme="dark"]{--bg:#0a1233;--card:#121e52;--tx:#eef2ff;--mut:#9aa7d6;--line:#26346f;--acc:#7fd4ff}
*{box-sizing:border-box;margin:0}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 70px)}
body{background:var(--bg);color:var(--tx);font:400 16px/1.5 Archivo,system-ui,sans-serif}
h1,h2,h3,.d{font-family:"Big Shoulders Display",Impact,"Arial Narrow",sans-serif;font-weight:800;line-height:.95}
a{color:inherit;text-decoration:none}button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--org);outline-offset:2px}
.w{max-width:1120px;margin:0 auto;padding:0 20px}
nav{view-transition-name:nav}
::view-transition-old(root){animation:.22s ease both out}
::view-transition-new(root){animation:.4s cubic-bezier(.2,.8,.2,1) both inn}
@keyframes out{to{opacity:0;transform:translateY(-10px)}}
@keyframes inn{from{opacity:0;transform:translateY(26px)}}
.novt #app{animation:inn .4s ease both}
.ann{background:var(--org);color:#fff;font-weight:700;font-size:14px;text-align:center;padding:8px 40px;position:relative}
.ann a{text-decoration:underline}.ann button{position:absolute;right:10px;top:3px;background:none;border:0;font-size:22px;cursor:pointer;color:#fff}
nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;background:var(--ink);color:#fff}
nav .w{display:flex;align-items:center;gap:22px;height:68px}
.brand{display:flex;align-items:center;gap:12px;font:900 26px "Big Shoulders Display",Impact,sans-serif}
.logo{background:var(--logo) center/contain no-repeat;flex:none;width:46px;height:48px;display:block}
nav ul{display:flex;gap:4px;list-style:none;padding:0;margin-left:auto;overflow-x:auto}
nav li a{display:block;padding:8px 12px;font-weight:700;font-size:15px;border-radius:6px;white-space:nowrap;position:relative}
nav li a:hover{background:var(--ink2)}
nav li a.on::after{content:"";position:absolute;left:12px;right:12px;bottom:0;height:3px;background:var(--org);border-radius:3px}
.pb{background:var(--ink);color:#fff;position:relative;overflow:hidden;padding:54px 0 50px}
.pb::before{content:attr(data-g);position:absolute;right:-10px;bottom:-34px;font:900 clamp(120px,24vw,260px)/1 "Big Shoulders Display",Impact,sans-serif;color:transparent;-webkit-text-stroke:2px rgba(255,255,255,.14);pointer-events:none;white-space:nowrap}
.pb::after{content:"";position:absolute;left:0;right:0;bottom:0;height:8px;background:linear-gradient(90deg,var(--org) 0 33%,#fff 33% 66%,var(--sky) 66%)}
.pb .w{position:relative}.pb h1{font-size:clamp(52px,10vw,104px)}.pb p{color:#d3dbf7;max-width:52ch;margin-top:12px}
.pb .crumb{font-weight:700;color:var(--sky);font-size:14px;margin-bottom:10px}
.pitch{position:absolute;left:-140px;top:-120px;width:520px;opacity:.1;pointer-events:none}
.hero{padding:62px 0 74px}.hero h1{font-size:clamp(58px,12vw,136px);max-width:9ch}
.hg{display:grid;grid-template-columns:1fr auto;gap:40px;align-items:center}
.logo.big{width:clamp(190px,27vw,320px);aspect-ratio:309/320;height:auto;filter:drop-shadow(0 18px 30px rgba(0,0,0,.4));transform:rotate(3deg)}
@media(max-width:760px){.hg{grid-template-columns:1fr}.logo.big{order:-1;width:150px}}
.ribbon{background:var(--org);color:var(--ink);transform:rotate(-1.4deg);margin:44px -20px 12px;overflow:hidden;white-space:nowrap;font:900 28px "Big Shoulders Display",Impact,sans-serif;border-block:4px solid var(--ink)}
.ribbon div{display:inline-block;padding:8px 0;animation:mv 36s linear infinite}
.ribbon span{margin:0 22px}.ribbon span::after{content:"\26BD";margin-left:44px}
@keyframes mv{to{transform:translateX(-50%)}}
.promo{margin:44px 0 0;border-radius:16px;overflow:hidden;background:var(--ink);color:#fff;display:grid;grid-template-columns:1.4fr 1fr}
.promo>div{padding:34px}.promo h2{font-size:clamp(34px,5vw,54px)}.promo p{color:#d3dbf7;margin:10px 0 18px}
.promo aside{background:repeating-linear-gradient(-45deg,var(--org) 0 22px,#ff7a45 22px 44px);display:grid;place-items:center;font:900 90px "Big Shoulders Display",sans-serif;color:var(--ink)}
@media(max-width:700px){.promo{grid-template-columns:1fr}.promo aside{height:90px}}
.btn{display:inline-block;background:var(--org);color:#fff;font-weight:700;padding:11px 20px;border-radius:99px;border:0;cursor:pointer}
.btn.o{background:transparent;border:2px solid currentColor}
section{padding:44px 0 4px}
.hd{display:flex;align-items:end;gap:14px;margin-bottom:20px}
.hd h2{font-size:clamp(34px,5vw,50px)}.hd a{font-weight:700;color:var(--acc);white-space:nowrap;order:2}
.hd::after{content:"";order:1;flex:1;height:4px;background:linear-gradient(90deg,var(--org) 0 56px,var(--line) 56px);margin-bottom:8px}
.list{display:grid;gap:10px}.day{font-weight:700;color:var(--mut);margin-top:10px}
.m{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:12px;background:var(--card);color:var(--tx);border-radius:12px;padding:14px 16px;border:1px solid var(--line)}
.m .t{display:flex;align-items:center;gap:10px;font-weight:700}.m .t:last-child{justify-content:flex-end;text-align:right}
.m .s{font:900 30px "Big Shoulders Display",Impact,sans-serif;min-width:84px;text-align:center}
.m .s small{display:block;font:500 12px Archivo,sans-serif;color:var(--mut)}
.cr{width:30px;height:30px;border-radius:50% 50% 46% 46%;flex:none;display:grid;place-items:center;color:#fff;font:800 12px Archivo}
.tabs{display:flex;gap:6px;margin-bottom:16px;flex-wrap:wrap;align-items:center}
.tabs button,.tabs select{font-weight:700;padding:9px 18px;border-radius:99px;border:2px solid var(--acc);background:transparent;cursor:pointer}
.tabs select{margin-left:auto;background:var(--card)}.tabs button[aria-selected=true]{background:var(--acc);color:var(--bg)}
.cols{display:grid;grid-template-columns:3fr 2fr;gap:28px}
@media(max-width:860px){.cols{grid-template-columns:1fr}nav ul{margin-left:0}.brand span{display:none}}
.ts{overflow-x:auto;background:var(--card);border:1px solid var(--line);border-radius:12px}
table{width:100%;border-collapse:collapse;font-size:15px;min-width:520px}
th,td{padding:12px 10px;text-align:center;border-bottom:1px solid var(--line)}
th{font-size:13px;color:var(--mut)}td:nth-child(2),th:nth-child(2){text-align:left}
td:first-child{font:800 20px "Big Shoulders Display",sans-serif;border-left:5px solid transparent}
tr.top td:first-child{border-left-color:var(--org)}td.p{font-weight:800}
tr[data-go]{cursor:pointer}tr[data-go]:hover{background:var(--bg)}
.tm{display:flex;align-items:center;gap:10px;font-weight:700}
.f{display:inline-flex;gap:3px}.f i{width:9px;height:9px;border-radius:50%;background:var(--line)}
.f i.W{background:#19b86a}.f i.D{background:#c9a400}.f i.L{background:#e5484d}
.key{color:var(--mut);font-size:14px;margin-top:10px}
.news{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:16px}
.n{background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden;display:block}.n:hover{border-color:var(--org)}
.n .im{height:130px;display:grid;place-items:center;color:#fff;font:900 54px "Big Shoulders Display",sans-serif;background:var(--c,var(--ink)) repeating-linear-gradient(-45deg,transparent 0 18px,rgba(255,255,255,.07) 18px 36px)}
.n .bd{padding:16px}.n h3{font-size:27px;margin:6px 0 8px}.n p{color:var(--mut);font-size:15px}

.n.big{grid-column:1/-1;display:grid;grid-template-columns:1fr 1fr}.n.big .im{height:100%;min-height:200px;font-size:96px}.n.big h3{font-size:clamp(32px,4vw,46px)}

.art{max-width:700px;margin:0 auto;padding:36px 20px 0}.art p{margin-bottom:18px;font-size:18px;line-height:1.65}.art h1{font-size:clamp(40px,7vw,68px);margin:10px 0 18px}
.teams{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px}
.tc{border-radius:14px;padding:20px 18px;color:#fff;min-height:190px;display:flex;flex-direction:column;justify-content:space-between;background:var(--c);position:relative;overflow:hidden}
.tc::after{content:attr(data-s);position:absolute;right:-8px;top:-18px;font:900 110px "Big Shoulders Display",sans-serif;color:rgba(255,255,255,.14)}
.tc .cr{width:46px;height:46px;background:rgba(255,255,255,.22);font-size:16px}

.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:12px;margin-bottom:8px}
.stats div{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;text-align:center}
.stats b{display:block;font:900 40px "Big Shoulders Display",sans-serif;color:var(--org)}.stats span{color:var(--mut);font-size:13px}
/* squads */
.squad{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px;margin:10px 0 18px}
.pl{display:flex;align-items:center;gap:14px;background:var(--card);border:1px solid var(--line);border-left:6px solid var(--c);border-radius:12px;padding:12px 14px}

.pl strong{display:block;font-weight:700}.pl .tag{background:var(--c);margin-top:4px}

/* team badges + Civo United theme (black and gold, matching the crest) */
.cr.bi{background:#0d1230;border-radius:50%;padding:3px;object-fit:contain}
.gold{background:linear-gradient(180deg,#f6e2a0,#d4a64a 55%,#9a6f1f);-webkit-background-clip:text;background-clip:text;color:transparent}
.crown{width:26px;height:22px;display:block}

.pb.th-civo h1{background:linear-gradient(180deg,#f6e2a0,#d4a64a 55%,#9a6f1f);-webkit-background-clip:text;background-clip:text;color:transparent;padding-bottom:4px}
.pb.th-civo .crumb{color:#d4a64a}.pb.th-civo .crumb a{color:#f6e2a0}.pb.th-civo p{color:#d9cfae}
.tbadge{position:absolute;right:max(20px,calc(50% - 540px));top:50%;transform:translateY(-50%);width:clamp(120px,21vw,270px);filter:drop-shadow(0 18px 34px rgba(0,0,0,.65));z-index:1}
.pb .w{position:relative;z-index:2}
@media(min-width:701px){.pb:has(.tbadge) .w{padding-right:clamp(150px,24vw,300px)}.pb.th-elland:has(.tbadge) .w,.pb.th-mandem:has(.tbadge) .w{padding-right:clamp(210px,33vw,430px)}}
@media(max-width:700px){.tbadge{opacity:.28;right:-10px}}
.thw.th-civo{background:#09090a;--card:#141416;--line:#2e2616;--mut:#a89a78;--bg:#09090a;--tx:#f4f1e8;--org:#d4a64a;color:var(--tx);padding-bottom:36px}

.thw.th-civo .stats b,.thw.th-civo .pl b{background:linear-gradient(180deg,#f6e2a0,#d4a64a 60%,#a77a24);-webkit-background-clip:text;background-clip:text;color:transparent}

/* shared: pin card text to the bottom */
.tc.th-avenue>div,.tc.th-baraka>div,.tc.th-samba>div,.tc.th-elland>div,.tc.th-mandem>div{margin-top:auto;position:relative;z-index:1}
/* 2nd Avenue: asphalt black, white road markings */
.tc.th-avenue{background:linear-gradient(135deg,#17181b,#0b0b0d);color:#fff;border:3px solid #fff;box-shadow:inset 0 0 0 5px #0b0b0d,inset 0 0 0 7px rgba(255,255,255,.35);justify-content:flex-start;gap:8px}

.tc.th-avenue .cb{width:78px;height:78px;filter:none}.tc.th-avenue h3{color:#fff}.tc.th-avenue small{color:#c9ccd1}
.pb.th-avenue{background:repeating-linear-gradient(112deg,transparent 0 56px,rgba(255,255,255,.045) 56px 60px),#0b0b0d}
.pb.th-avenue::before{right:auto;left:-10px;-webkit-text-stroke-color:rgba(255,255,255,.1)}

.thw.th-avenue .pl{border-left-color:#fff}.thw.th-avenue .pl .tag{background:#fff;color:#0b0b0d}.thw.th-avenue .day{color:#c9ccd1}

.tc.th-baraka{background:#edbc3f;color:#0b0b0b;border:3px solid #0b0b0b;justify-content:flex-start;gap:8px}

.tc.th-baraka h3{color:#0b0b0b}.tc.th-baraka small{color:#3d2f08}
.pb.th-baraka{background:#edbc3f;color:#0b0b0b}.pb.th-baraka::before{right:auto;left:-10px;-webkit-text-stroke-color:rgba(11,11,11,.14)}
.pb.th-baraka::after{height:14px;background:repeating-linear-gradient(-45deg,#0b0b0b 0 14px,#edbc3f 14px 28px)}

.thw.th-baraka{background:#fff;--card:#fff;--bg:#fff;--tx:#0b0b0b;--line:#f0e1b2;--mut:#6b5a1d;--org:#edbc3f;color:var(--tx);padding-bottom:36px}

.thw.th-baraka .stats div{border-top:6px solid #edbc3f}.thw.th-baraka .stats b{color:#0b0b0b}.thw.th-baraka .pl b{color:#edbc3f}
.thw.th-baraka .pl{border-left-color:#edbc3f}.thw.th-baraka .pl .tag{background:#edbc3f;color:#0b0b0b}
/* Samba Boys: black, white and grey facets */
:root{--facet:linear-gradient(135deg,#f7f8f9 0 34%,transparent 34%),linear-gradient(205deg,#dfe2e6 0 26%,transparent 26%),linear-gradient(320deg,#e9ebee 0 38%,transparent 38%),#d9dce0}
.tc.th-samba{background:var(--facet);color:#0b0b0c;border:3px solid #0b0b0c;justify-content:flex-start;gap:8px}

.tc.th-samba h3{color:#0b0b0c}.tc.th-samba small{color:#4a4f56}
.pb.th-samba{background:var(--facet);color:#0b0b0c}.pb.th-samba::before{right:auto;left:-10px;-webkit-text-stroke-color:rgba(11,11,12,.12)}

.pb.th-samba p{color:#3d4249}.pb.th-samba .crumb,.pb.th-samba .crumb a{color:#0b0b0c}
.pb.th-samba .tbadge{border-radius:50%;box-shadow:0 0 0 6px #0b0b0c,0 20px 40px rgba(0,0,0,.25);filter:none}
.thw.th-samba{background:#f4f5f6;--card:#fff;--bg:#f4f5f6;--tx:#0b0b0c;--line:#d5d8dc;--mut:#5a5f66;--org:#0b0b0c;color:var(--tx);padding-bottom:36px}
.thw.th-samba .hd::after{background:linear-gradient(90deg,#0b0b0c 0 56px,#d5d8dc 56px)}
.thw.th-samba .stats b,.thw.th-samba .pl b{color:#0b0b0c}.thw.th-samba .pl{border-left-color:#0b0b0c}.thw.th-samba .pl .tag{background:#0b0b0c;color:#fff}
/* Elland: red, white and gold stars */
.tc.th-elland{background:repeating-radial-gradient(ellipse 80% 55% at 105% 110%,transparent 0 22px,rgba(255,255,255,.14) 22px 25px),linear-gradient(160deg,#c20010,#680008);color:#fff;border:3px solid #fff;justify-content:flex-start;gap:10px}
.tc.th-elland::after{content:none}
.tc.th-elland .cb{width:100%;max-width:170px;height:auto;filter:drop-shadow(0 6px 10px rgba(0,0,0,.45))}
.tc.th-elland h3{text-transform:uppercase;letter-spacing:.03em}.tc.th-elland small{color:#ffd9dc}
.pb.th-elland{background:repeating-radial-gradient(ellipse 52% 90% at 82% 48%,transparent 0 40px,rgba(255,255,255,.08) 40px 43px),radial-gradient(ellipse 70% 130% at 80% 45%,#b80012,#3f0006 75%);color:#fff}
.pb.th-elland::before{right:auto;left:-10px;-webkit-text-stroke-color:rgba(255,255,255,.12)}
.pb.th-elland::after{height:12px;background:linear-gradient(90deg,#f8c800 0 34%,#fff 34% 67%,#e30000 67%)}
.pb.th-elland p{color:#ffd9dc}.pb.th-elland .crumb,.pb.th-elland .crumb a{color:#f8c800}.pb.th-elland .tbadge{width:clamp(220px,34vw,440px)}
.thw.th-elland{background:#fff;--card:#fff;--bg:#fff;--tx:#2a0a0d;--line:#f3d4d6;--mut:#8a5a5e;--org:#e30000;color:var(--tx);padding-bottom:36px}
.thw.th-elland .hd::after{background:linear-gradient(90deg,#e30000 0 56px,#f3d4d6 56px)}
.thw.th-elland .stats div{border-top:4px solid #f8c800}.thw.th-elland .stats b,.thw.th-elland .pl b{color:#e30000}
.thw.th-elland .pl{border-left-color:#e30000}.thw.th-elland .pl .tag{background:#e30000}
/* Mandem: street black, white brush, gold crown */
.tc.th-mandem{background:radial-gradient(rgba(255,255,255,.1) 1.3px,transparent 1.7px) 0 0/11px 11px,#070707;color:#fff;border:3px solid #fff;justify-content:flex-start;gap:8px}
.tc.th-mandem::after{content:"";top:auto;left:auto;right:-14px;bottom:-6px;width:150px;height:62px;font-size:0;background:linear-gradient(90deg,#daa33f,#f2c56e);clip-path:polygon(0 38%,100% 0,94% 100%,6% 82%)}
.tc.th-mandem .cb{width:100%;max-width:200px;height:auto;filter:drop-shadow(0 6px 10px rgba(0,0,0,.6))}

.pb.th-mandem{background:radial-gradient(rgba(255,255,255,.08) 1.4px,transparent 1.8px) 0 0/12px 12px,#070707}

.pb.th-mandem .crumb,.pb.th-mandem .crumb a{color:#daa33f}.pb.th-mandem p{color:#cfcfcf}.pb.th-mandem .tbadge{width:clamp(220px,34vw,470px);filter:drop-shadow(0 18px 30px rgba(0,0,0,.7))}
.thw.th-mandem{background:#070707;--card:#121212;--bg:#070707;--tx:#f5f5f5;--line:#2a2a2a;--mut:#a3a3a3;--org:#daa33f;color:var(--tx);padding-bottom:36px}
.thw.th-mandem .hd::after{background:linear-gradient(90deg,#daa33f 0 56px,#2a2a2a 56px)}
.thw.th-mandem .stats div{border-left:5px solid #daa33f}.thw.th-mandem .stats b{color:#fff;font-style:italic}
.thw.th-mandem .pl{border-left-color:#fff}.thw.th-mandem .pl b{color:#fff;font-style:italic}.thw.th-mandem .pl .tag{background:#daa33f;color:#070707}.thw.th-mandem .day{color:#daa33f}
/* stats */
.lbs{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:16px}
.lb{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px 18px}
.lb h3{font-size:26px;margin-bottom:8px}.lb ol{list-style:none;padding:0}
.lb li{display:flex;align-items:center;gap:12px;padding:9px 0;border-top:1px solid var(--line)}
.lb li>b{font:900 22px "Big Shoulders Display",sans-serif;width:20px;color:var(--mut)}.lb li:first-child>b{color:var(--org)}
.lb li span{flex:1;min-width:0}.lb li strong{display:block;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lb li small,small.mt{display:block;color:var(--mut);font-size:12px;font-weight:400}
.lb li em{font:900 30px "Big Shoulders Display",sans-serif;font-style:normal}.lb li:first-child em{color:var(--org)}
th[data-sk]{cursor:pointer;user-select:none;white-space:nowrap}th.srt{color:var(--acc)}
.pstat{display:block;color:var(--mut);font-size:12px;margin-top:3px}
.msh{min-width:0}.msh td,.msh th{padding:8px 6px}.msh td:first-child,.msh th:first-child{text-align:left}
.msh input[type=number]{width:58px;padding:6px 8px;text-align:center}.msh input[type=checkbox]{width:20px;height:20px}
.sd h3{display:flex;align-items:center;gap:8px;font-size:26px;margin:14px 0 8px}
.tally{font:700 13px Archivo,sans-serif;margin-left:6px}.tally.bad{color:#e5484d}.tally.good{color:#19b86a}
/* gameweeks */
.wkbar{display:flex;gap:8px;overflow-x:auto;padding:4px 2px 14px;margin-bottom:6px}
.wkbar a{flex:none;min-width:46px;height:46px;display:grid;place-items:center;border-radius:12px;border:2px solid var(--line);background:var(--card);font:800 22px "Big Shoulders Display",sans-serif}
.wkbar a.done{border-color:var(--acc)}.wkbar a.on{background:var(--acc);color:var(--bg);border-color:var(--acc)}
.gm.has .m{border-radius:12px 12px 0 0;border-bottom:0}
.md{display:grid;grid-template-columns:1fr 1fr;gap:18px;background:var(--card);border:1px solid var(--line);border-top:1px dashed var(--line);border-radius:0 0 12px 12px;padding:14px 16px}
.md.one{grid-template-columns:1fr}@media(max-width:700px){.md{grid-template-columns:1fr}}
.mc h4{display:flex;align-items:center;gap:8px;font:800 20px "Big Shoulders Display",sans-serif;margin-bottom:8px}
.mc ul{list-style:none;padding:0;display:grid;gap:6px;font-size:14px}.mc li{display:flex;gap:10px}
.mc .lbl{flex:none;width:80px;color:var(--mut);font-weight:700}.mc .none{color:var(--mut)}.mc .note{color:var(--mut);font-size:12px;margin-top:8px}
.cd{display:inline-block;width:9px;height:13px;border-radius:2px;margin-right:5px;vertical-align:-2px}.cd.y{background:#f2c200}.cd.r{background:#e5484d}
/* glory: roll of honour */
.pb.th-glory{background:radial-gradient(ellipse 60% 130% at 82% 40%,rgba(240,184,58,.28),transparent 62%),linear-gradient(160deg,#0e1a4f,#070d30)}
.pb.th-glory::before{right:auto;left:-10px;-webkit-text-stroke-color:rgba(240,184,58,.18)}
.pb.th-glory::after{height:10px;background:linear-gradient(90deg,#a8741a,#fff2b8 30%,#f0b83a 55%,#fff2b8 80%,#a8741a)}
.pb.th-glory h1{background:linear-gradient(180deg,#fff2b8,#f0b83a 60%,#a8741a);-webkit-background-clip:text;background-clip:text;color:transparent;padding-bottom:4px}
.pb.th-glory .crumb{color:#f0b83a}
.gtrophy{position:absolute;right:max(24px,calc(50% - 520px));top:50%;transform:translateY(-50%);width:clamp(110px,18vw,220px);filter:drop-shadow(0 16px 34px rgba(240,184,58,.35));z-index:1}
.trophy{display:block;width:100%;height:auto}
@media(max-width:700px){.gtrophy{opacity:.3;right:-6px}}
.gtitles{display:flex;flex-wrap:wrap;gap:12px}
.gt{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--line);border-left:6px solid var(--c);border-radius:12px;padding:10px 16px}
.gt span{font-weight:700}.gt b{font:900 34px "Big Shoulders Display",sans-serif;color:var(--org);margin-left:6px}
.gl-list{display:grid;gap:14px}
.gl{display:grid;grid-template-columns:150px 1.3fr 1fr;gap:20px;align-items:center;background:var(--card);border:1px solid var(--line);border-left:8px solid var(--c);border-radius:14px;padding:18px 22px}
.gl.first{background:linear-gradient(100deg,rgba(240,184,58,.16),transparent 55%),var(--card);border-color:#f0b83a;box-shadow:0 0 0 1px rgba(240,184,58,.4)}
.gs{font:900 56px/1 "Big Shoulders Display",sans-serif;color:var(--org)}
.gc{display:flex;align-items:center;gap:16px}.gc h3{font-size:38px;margin-top:4px}
.gb{width:84px;height:84px;object-fit:contain;flex:none;background:#0d1230;border-radius:50%;padding:8px}.gb2{width:70px;height:70px;font-size:28px}
.gm2{list-style:none;padding:0;display:grid;gap:8px;font-size:15px}
.gm2 li span{display:block;color:var(--mut);font-size:12px;font-weight:700;letter-spacing:.04em;text-transform:uppercase}.gm2 .gn{color:var(--mut);font-style:italic}

  t.textContent=`Goals logged ${sum} of ${sc}`+(sum===sc?"":" (own goal or missing scorer?)");t.className="tally "+(sum===sc?"good":"bad")});
 B.oninput=e=>{const tr=e.target.closest("tr");if(tr&&e.target.dataset.s!=="played"&&+e.target.value>0)tr.querySelector("[data-s=played]").checked=true;tally()};tally();
 $("#ms-save").onclick=()=>{const out=[];B.querySelectorAll(".sd").forEach(d=>d.querySelectorAll("tr[data-p]").forEach(tr=>{const g=k=>parseInt(tr.querySelector(`[data-s=${k}]`).value,10)||0,r={player:tr.dataset.p,team:d.dataset.t,played:tr.querySelector("[data-s=played]").checked?1:0,goals:g("goals"),assists:g("assists"),yellow:g("yellow"),red:g("red"),pen_missed:g("pen_missed")};if(r.played||r.goals||r.assists||r.yellow||r.red||r.pen_missed)out.push(r)}));
  run(async()=>{if(MODE==="live")await api("PUT","/match-stats/"+encodeURIComponent(f.id),{rows:out});D.stats=D.stats.filter(s=>s.fixture!==f.id).concat(out.map(r=>({...r,id:f.id+"_"+r.player,fixture:f.id})))},"Saved. Stats and clean sheets are updated.")}}

/* ---------- router ---------- */
const rm=matchMedia("(prefers-reduced-motion:reduce)").matches;
function after(r){
 if(r==="fantasy")fanInit();
 if(r==="champions")clInit();
 if(r==="stats")statsInit();
 if(r==="matches"){const draw=()=>{const ok=m=>!MF||m.home===MF||m.away===MF;$("#ml").innerHTML=grouped((MV==="fx"?upcoming():results()).filter(ok))};
  document.querySelectorAll(".tabs button").forEach(b=>b.onclick=()=>{MV=b.dataset.v;document.querySelectorAll(".tabs button").forEach(x=>x.setAttribute("aria-selected",x===b));draw()});$("#tf").onchange=e=>{MF=e.target.value;draw()};draw()}
 if(r==="admin"&&MODE==="live"){
  if(!canEdit()){$("#lf").onsubmit=async e=>{e.preventDefault();const m=$("#a-msg");m.textContent="Signing in...";try{const j=await api("POST","/login",{password:$("#pw").value});setTok(j.token);route(false)}catch(x){m.textContent=x.message}}}
  else{document.querySelectorAll("#at button[data-k]").forEach(b=>b.onclick=()=>{AT=b.dataset.k;document.querySelectorAll("#at button[data-k]").forEach(x=>x.setAttribute("aria-selected",x===b));adminTab()});
   if($("#so"))$("#so").onclick=()=>{setTok(null);route(false)};adminTab()}}}
function route(vt=true){const [r,a]=(location.hash.replace(/^#\/?/,"")||"home").split("/");
 const html=MODE==="error"&&r!=="admin"?P.down():r==="news"&&a?P.article(a):r==="team"?P.team(a):r==="player"?player(a):(P[r]||P.home)(a);const key=r==="team"||r==="player"?"teams":r;
 const apply=()=>{const y=scrollY;$("#app").innerHTML=html;document.querySelectorAll("#nv a").forEach(x=>x.classList.toggle("on",x.dataset.r===key));scrollTo(0,vt?0:y);after(r);
  document.querySelectorAll("tr[data-go]").forEach(tr=>tr.onclick=()=>location.hash=tr.dataset.go)};
 if(vt&&document.startViewTransition&&!rm)document.startViewTransition(apply);else{if(vt)document.documentElement.classList.add("novt");apply()}}
function ann(){const a=D.site.ann,e=$("#ann");if(a&&a.on&&a.text){e.hidden=false;e.innerHTML=`${esc(a.text)} ${a.label?`<a href="${esc(a.link)}">${esc(a.label)}</a>`:""}<button aria-label="Dismiss" onclick="this.parentNode.hidden=true">&times;</button>`}else e.hidden=true}
function changed(){ann();if((location.hash.replace(/^#\/?/,"")||"home").split("/")[0]==="admin"&&canEdit()&&$("#ad")){adminList();return}route(false)}
addEventListener("hashchange",()=>route(true));
/* load: real backend if it answers, otherwise demo data */
(async()=>{try{const d=await api("GET","/data");if(!Array.isArray(d.teams))throw 0;D={teams:d.teams,fixtures:d.fixtures||[],news:d.news||[],players:d.players||[],stats:d.stats||[],glory:d.glory||[],cl:d.cl||[],site:{...DEF.site,...(d.site||{})}};MODE="live";if(TOKEN){try{await api("GET","/me")}catch(e){if(e.status===401)setTok(null)}}}
 catch(e){if(e&&e.status>=500){MODE="error";D={teams:[],fixtures:[],news:[],players:[],stats:[],glory:[],cl:[],site:{}}}
  else{D={teams:DEF.teams,fixtures:DEF.fixtures,news:DEF.news,players:DEF.players,stats:DEF.stats,glory:DEF.glory,cl:DEF.cl,site:DEF.site};MODE="demo"}}
 $("#adl").hidden=MODE!=="live";ann();route(true)})();
</script>
