box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0a1233;--card:#121e52;--tx:#eef2ff;--mut:#9aa7d6;--line:#26346f;--acc:#7fd4ff}}
:root[data-theme="dark"]{--bg:#0a1233;--card:#121e52;--tx:#eef2ff;--mut:#9aa7d6;--line:#26346f;--acc:#7fd4ff}
*{box-sizing:border-box;margin:0}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 70px)}
body{background:var(--bg);color:var(--tx);font:400 16px/1.5 Archivo,system-ui,sans-serif}
h1,h2,h3,.d{font-family:"Big Shoulders Display",Impact,"Arial Narrow",sans-serif;font-weight:800;line-height:.95}
a{color:inherit;text-decoration:none}button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--org);outline-offset:2px}
.w{max-width:1120px;margin:0 auto;padding:0 20px}
nav{view-transition-name:nav}
::view-transition-old(root){animation:.22s ease both out}
::view-transition-new(root){animation:.4s cubic-bezier(.2,.8,.2,1) both inn}
@keyframes out{to{opacity:0;transform:translateY(-10px)}}
@keyframes inn{from{opacity:0;transform:translateY(26px)}}
.novt #app{animation:inn .4s ease both}
.ann{background:var(--org);color:#fff;font-weight:700;font-size:14px;text-align:center;padding:8px 40px;position:relative}
.ann a{text-decoration:underline}.ann button{position:absolute;right:10px;top:3px;background:none;border:0;font-size:22px;cursor:pointer;color:#fff}
nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;background:var(--ink);color:#fff}
nav .w{display:flex;align-items:center;gap:22px;height:68px}
.brand{display:flex;align-items:center;gap:12px;font:900 26px "Big Shoulders Display",Impact,sans-serif}
.logo{background:var(--logo) center/contain no-repeat;flex:none;width:46px;height:48px;display:block}
nav ul{display:flex;gap:4px;list-style:none;padding:0;margin-left:auto;overflow-x:auto}
nav li a{display:block;padding:8px 12px;font-weight:700;font-size:15px;border-radius:6px;white-space:nowrap;position:relative}
nav li a:hover{background:var(--ink2)}
nav li a.on::after{content:"";position:absolute;left:12px;right:12px;bottom:0;height:3px;background:var(--org);border-radius:3px}
.pb{background:var(--ink);color:#fff;position:relative;overflow:hidden;padding:54px 0 50px}
.pb::before{content:attr(data-g);position:absolute;right:-10px;bottom:-34px;font:900 clamp(120px,24vw,260px)/1 "Big Shoulders Display",Impact,sans-serif;color:transparent;-webkit-text-stroke:2px rgba(255,255,255,.14);pointer-events:none;white-space:nowrap}
.pb::after{content:"";position:absolute;left:0;right:0;bottom:0;height:8px;background:linear-gradient(90deg,var(--org) 0 33%,#fff 33% 66%,var(--sky) 66%)}
.pb .w{position:relative}.pb h1{font-size:clamp(52px,10vw,104px)}.pb p{color:#d3dbf7;max-width:52ch;margin-top:12px}
.pb .crumb{font-weight:700;color:var(--sky);font-size:14px;margin-bottom:10px}
.pitch{position:absolute;left:-140px;top:-120px;width:520px;opacity:.1;pointer-events:none}
.hero{padding:62px 0 74px}.hero h1{font-size:clamp(58px,12vw,136px);max-width:9ch}
.hg{display:grid;grid-template-columns:1fr auto;gap:40px;align-items:center}
.logo.big{width:clamp(190px,27vw,320px);aspect-ratio:309/320;height:auto;filter:drop-shadow(0 18px 30px rgba(0,0,0,.4));transform:rotate(3deg)}
@media(max-width:760px){.hg{grid-template-columns:1fr}.logo.big{order:-1;width:150px}}
.ribbon{background:var(--org);color:var(--ink);transform:rotate(-1.4deg);margin:44px -20px 12px;overflow:hidden;white-space:nowrap;font:900 28px "Big Shoulders Display",Impact,sans-serif;border-block:4px solid var(--ink)}
.ribbon div{display:inline-block;padding:8px 0;animation:mv 36s linear infinite}
.ribbon span{margin:0 22px}.ribbon span::after{content:"\26BD";margin-left:44px}
@keyframes mv{to{transform:translateX(-50%)}}
.promo{margin:44px 0 0;border-radius:16px;overflow:hidden;background:var(--ink);color:#fff;display:grid;grid-template-columns:1.4fr 1fr}
.promo>div{padding:34px}.promo h2{font-size:clamp(34px,5vw,54px)}.promo p{color:#d3dbf7;margin:10px 0 18px}
.promo aside{background:repeating-linear-gradient(-45deg,var(--org) 0 22px,#ff7a45 22px 44px);display:grid;place-items:center;font:900 90px "Big Shoulders Display",sans-serif;color:var(--ink)}
@media(max-width:700px){.promo{grid-template-columns:1fr}.promo aside{height:90px}}
.btn{display:inline-block;background:var(--org);color:#fff;font-weight:700;padding:11px 20px;border-radius:99px;border:0;cursor:pointer}
.btn.o{background:transparent;border:2px solid currentColor}
section{padding:44px 0 4px}
.hd{display:flex;align-items:end;gap:14px;margin-bottom:20px}
.hd h2{font-size:clamp(34px,5vw,50px)}.hd a{font-weight:700;color:var(--acc);white-space:nowrap;order:2}
.hd::after{content:"";order:1;flex:1;height:4px;background:linear-gradient(90deg,var(--org) 0 56px,var(--line) 56px);margin-bottom:8px}
.list{display:grid;gap:10px}.day{font-weight:700;color:var(--mut);margin-top:10px}
.m{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:12px;background:var(--card);color:var(--tx);border-radius:12px;padding:14px 16px;border:1px solid var(--line)}
.m .t{display:flex;align-items:center;gap:10px;font-weight:700}.m .t:last-child{justify-content:flex-end;text-align:right}
.m .s{font:900 30px "Big Shoulders Display",Impact,sans-serif;min-width:84px;text-align:center}
.m .s small{display:block;font:500 12px Archivo,sans-serif;color:var(--mut)}
.cr{width:30px;height:30px;border-radius:50% 50% 46% 46%;flex:none;display:grid;place-items:center;color:#fff;font:800 12px Archivo}
.tabs{display:flex;gap:6px;margin-bottom:16px;flex-wrap:wrap;align-items:center}
.tabs button,.tabs select{font-weight:700;padding:9px 18px;border-radius:99px;border:2px solid var(--acc);background:transparent;cursor:pointer}
.tabs select{margin-left:auto;background:var(--card)}.tabs button[aria-selected=true]{background:var(--acc);color:var(--bg)}
.cols{display:grid;grid-template-columns:3fr 2fr;gap:28px}
@media(max-width:860px){.cols{grid-template-columns:1fr}nav ul{margin-left:0}.brand span{display:none}}
.ts{overflow-x:auto;background:var(--card);border:1px solid var(--line);border-radius:12px}
table{width:100%;border-collapse:collapse;font-size:15px;min-width:520px}
th,td{padding:12px 10px;text-align:center;border-bottom:1px solid var(--line)}
th{font-size:13px;color:var(--mut)}td:nth-child(2),th:nth-child(2){text-align:left}
td:first-child{font:800 20px "Big Shoulders Display",sans-serif;border-left:5px solid transparent}
tr.top td:first-child{border-left-color:var(--org)}td.p{font-weight:800}
tr[data-go]{cursor:pointer}tr[data-go]:hover{background:var(--bg)}
.tm{display:flex;align-items:center;gap:10px;font-weight:700}
.f{display:inline-flex;gap:3px}.f i{width:9px;height:9px;border-radius:50%;background:var(--line)}
.f i.W{background:#19b86a}.f i.D{background:#c9a400}.f i.L{background:#e5484d}

const CROWN='<svg class="crown" viewBox="0 0 24 20" aria-hidden="true"><defs><linearGradient id="gg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f6e2a0"/><stop offset="1" stop-color="#a77a24"/></linearGradient></defs><path d="M2 18 4 5l5 6 3-9 3 9 5-6 2 13z" fill="url(#gg)"/></svg>';
const mrow=f=>{const a=T(f.home),b=T(f.away);return `<div class="m"><div class="t">${crest(a)}${esc(a.name)}</div><div class="s">${played(f)?f.hg+" - "+f.ag:esc(f.time)}<small>${played(f)?"Full time":esc(f.venue)}</small></div><div class="t">${esc(b.name)}${crest(b)}</div></div>`};
function grouped(src){let l="",h="";src.forEach(m=>{if(m.date!==l){h+=`<div class="day">${fmtDay(m.date)}</div>`;l=m.date}h+=mrow(m)});return h||'<p class="hint">Nothing here yet.</p>'}
function standings(){const S=teams().map(t=>({t,p:0,w:0,d:0,l:0,gf:0,ga:0,pts:0,f:[]})),ix=Object.fromEntries(S.map(s=>[s.t.id,s]));
 [...D.fixtures].filter(played).sort(byTime).forEach(m=>[[m.home,+m.hg,+m.ag],[m.away,+m.ag,+m.hg]].forEach(([id,g,c])=>{const s=ix[id];if(!s)return;s.p++;s.gf+=g;s.ga+=c;const r=g>c?"W":g<c?"L":"D";s[r.toLowerCase()]++;s.pts+=r==="W"?3:r==="D"?1:0;s.f.push(r)}));
 return S.sort((a,b)=>b.pts-a.pts||(b.gf-b.ga)-(a.gf-a.ga)||b.gf-a.gf||a.t.name.localeCompare(b.t.name))}
const gd=s=>(s.gf-s.ga>0?"+":"")+(s.gf-s.ga);
const banner=(g,h,p,crumb,bg,cls="",extra="")=>`<header class="pb ${cls}" data-g="${esc(g)}" ${bg?`style="background:${esc(bg)}"`:""}>${extra}<svg class="pitch" viewBox="0 0 400 400" fill="none" stroke="#fff" stroke-width="3" aria-hidden="true"><circle cx="200" cy="200" r="120"/><circle cx="200" cy="200" r="6" fill="#fff"/><path d="M0 200h400"/></svg><div class="w">${crumb?`<div class="crumb">${crumb}</div>`:""}<h1>${esc(h)}</h1>${p?`<p>${esc(p)}</p>`:""}</div></header>`;
const ribbon=()=>D.site.ribbon?`<div style="overflow:hidden"><div class="ribbon" aria-hidden="true"><div>${`<span>${esc(D.site.ribbon)}</span>`.repeat(16)}</div></div></div>`:"";
const ncard=(n,big)=>`<a class="n ${big?"big":""}" href="#/news/${esc(n.id)}" style="--c:${esc(n.color||"#0d1a4a")}"><div class="im">${esc(n.tag)}</div><div class="bd"><span class="tag">${esc(n.tag)}</span><span class="dt">${fmtLong(n.date)}</span><h3>${esc(n.title)}</h3><p>${esc(n.summary)}</p></div></a>`;
const tableHTML=S=>`<div class="ts"><table><thead><tr><th>#</th><th>Team</th><th>P</th><th>W</th><th>D</th><th>L</th><th>GF</th><th>GA</th><th>GD</th><th>Pts</th><th>Form</th></tr></thead><tbody>${S.map((s,i)=>`<tr class="${i<2?"top":""}" data-go="#/team/${esc(s.t.id)}"><td>${i+1}</td><td><div class="tm">${crest(s.t)}${esc(s.t.name)}</div></td><td>${s.p}</td><td>${s.w}</td><td>${s.d}</td><td>${s.l}</td><td>${s.gf}</td><td>${s.ga}</td><td>${gd(s)}</td><td class="p">${s.pts}</td><td><span class="f">${s.f.slice(-5).map(r=>`<i class="${r}" title="${r}"></i>`).join("")}</span></td></tr>`).join("")}</tbody></table></div>`;
const count=id=>D.players.filter(p=>p.team===id).length;
const teamCard=t=>`<a class="tc ${t.theme?"th-"+esc(t.theme):""}" href="#/team/${esc(t.id)}" style="--c:${esc(t.c)}" data-s="${esc(t.short)}">${t.theme==="civo"?CROWN:""}${t.badge?`<img class="cb" src="${esc(t.badge)}" alt="">`:`<span class="cr">${esc((t.short||"?")[0])}</span>`}<div><h3>${esc(t.name)}</h3><small>${count(t.id)?count(t.id)+" players":"View team"}</small></div></a>`;
const POS=[["GK","Goalkeepers"],["DEF","Defenders"],["MID","Midfielders"],["FWD","Forwards"]];
const squad=t=>{const ps=D.players.filter(p=>p.team===t.id);if(!ps.length)return '<p class="hint">Squad coming soon.</p>';
 return POS.map(([k,l])=>{const g=ps.filter(p=>p.pos===k).sort((a,b)=>(a.num??999)-(b.num??999));return g.length?`<div class="day">${l}</div><div class="squad" style="--c:${esc(t.c)}">${g.map(p=>`<div class="pl"><b>${p.num??"–"}</b><div><strong>${esc(p.name)}</strong><span class="tag">${k}</span></div></div>`).join("")}</div>`:""}).join("")};

const P={
home(){const up=upcoming(),nd=up[0]?.date,S=standings(),pr=D.site.promo;
 return `<header class="pb hero" data-g=""><svg class="pitch" viewBox="0 0 400 400" fill="none" stroke="#fff" stroke-width="3" aria-hidden="true"><circle cx="200" cy="200" r="120"/><circle cx="200" cy="200" r="6" fill="#fff"/><path d="M0 200h400"/></svg><div class="w hg"><div><h1>Seven a side. All the noise.</h1><p>Fixtures, results, tables and news from the K South League in Embakasi West, updated every matchday.</p><div class="list" style="max-width:640px;margin-top:30px"><div class="day" style="color:#7fd4ff;margin:0">${nd?"Next matchday: "+fmtDay(nd):"No fixtures scheduled yet"}</div>${up.filter(f=>f.date===nd).map(mrow).join("")}</div></div><div class="logo big" role="img" aria-label="K South League crest, Embakasi West, est. 2024"></div></div></header>${ribbon()}
<main class="w"><section><div class="hd"><h2>Top of the table</h2><a href="#/table">Full table</a></div>${tableHTML(S.slice(0,3))}</section>
<section><div class="hd"><h2>Latest news</h2><a href="#/news">All news</a></div><div class="news">${newsList().slice(0,3).map(n=>ncard(n)).join("")||'<p class="hint">No news yet.</p>'}</div></section>
${pr&&pr.on?`<div class="promo"><div><h2>${esc(pr.title)}</h2><p>${esc(pr.text)}</p><a class="btn" href="${esc(pr.link)}">${esc(pr.label)}</a></div><aside>${esc(pr.big)}</aside></div>`:""}
<section><div class="hd"><h2>Teams</h2><a href="#/teams">All teams</a></div><div class="teams">${teams().map(teamCard).join("")}</div></section></main>`},
matches(){return banner("MD","Matches","Every fixture and result, newest first.")+`<main class="w"><section><div class="tabs"><button role="tab" data-v="fx" aria-selected="${MV==="fx"}">Fixtures</button><button role="tab" data-v="rs" aria-selected="${MV==="rs"}">Results</button><select id="tf" aria-label="Filter by team"><option value="">All teams</option>${teams().map(t=>`<option value="${esc(t.id)}" ${MF===t.id?"selected":""}>${esc(t.name)}</option>`).join("")}</select></div><div class="list" id="ml"></div></section></main>`},
table(){return banner("PTS","Table","Three points for a win, one for a draw. Tap a team to open it.")+`<main class="w"><section><div class="cols"><div>${tableHTML(standings())}<p class="key">Orange marker: top two.</p></div><div class="ed"><b>Top scorers</b><p class="hint">Goal tallies arrive with player stats in a later stage.</p></div></div></section></main>`},
news(){const a=newsList();return banner("NEWS","News","Reports, notices and league updates.")+`<main class="w"><section><div class="news">${a.length?ncard(a[0],true)+a.slice(1).map(n=>ncard(n)).join(""):'<p class="hint">No news yet.</p>'}</div></section></main>`},
article(id){const n=D.news.find(x=>x.id===id);if(!n)return P.news();return `<div class="pb" data-g="${esc(n.tag)}" style="background:${esc(n.color||"#0d1a4a")}"><div class="w"><div class="crumb" style="color:#fff"><a href="#/news">News</a> / ${esc(n.tag)}</div></div></div><article class="art"><span class="tag">${esc(n.tag)}</span><span class="dt">${fmtLong(n.date)}</span><h1>${esc(n.title)}</h1>${String(n.body||"").split(/\n\s*\n/).map(p=>`<p>${esc(p)}</p>`).join("")}<p><a class="btn o" href="#/news">All news</a></p></article>`},
teams(){return banner("CLUBS","Teams","Six clubs. One trophy.")+`<main class="w"><section><div class="teams">${teams().map(teamCard).join("")}</div></section></main>`},
team(id){const t=D.teams.find(x=>x.id===id);if(!t)return P.teams();const S=standings(),s=S.find(x=>x.t.id===id),mine=f=>f.home===id||f.away===id;
 const sub=[t.bio,t.manager?"Manager: "+t.manager:"",t.ground?"Home ground: "+t.ground:""].filter(Boolean).join(" ")||("Position "+(S.indexOf(s)+1)+" in the table.");
 const th=t.theme?"th-"+t.theme:"";return banner(t.short,t.name,sub,`<a href="#/teams">Teams</a> / ${esc(t.name)}`,t.theme?"":t.c,th,(t.theme==="civo"?"":"")+(t.badge?`<img class="tbadge" src="${esc(t.badge)}" alt="${esc(t.name)} crest">`:""))+`<div class="${th?"thw "+th:""}" style="--c:${esc(t.c)}"><main class="w"><section><div class="stats">${[["Position",S.indexOf(s)+1],["Played",s.p],["Won",s.w],["Drawn",s.d],["Lost",s.l],["Goal diff",gd(s)],["Points",s.pts]].map(x=>`<div><b>${x[1]}</b><span>${x[0]}</span></div>`).join("")}</div></section>
 <section><div class="hd"><h2>Squad</h2></div>${squad(t)}</section>
 <section><div class="hd"><h2>Fixtures</h2></div><div class="list">${grouped(upcoming().filter(mine))}</div></section><section><div class="hd"><h2>Results</h2></div><div class="list">${grouped(results().filter(mine))}</div></section></main></div>`},
down(){return banner("OFFLINE","Back shortly","The league site can't reach its database right now. Please try again in a minute.")+`<main class="w"><section><a class="btn" href="#/" onclick="location.reload();return false">Try again</a></section></main>`},
admin(){const head=banner("ADMIN","Admin","Add fixtures, enter scores, write news, update teams and build squads.");
 if(MODE!=="live")return head+`<main class="w"><section><div class="empty">${MODE==="demo"?"Admin needs the live backend and its password. This preview has no database, so nothing can be edited here.":"Admin is unavailable while the site can't reach its database."}</div></section></main>`;
 if(!canEdit())return head+`<main class="w"><section><form class="ed" id="lf" style="max-width:420px" onsubmit="return false"><b>Sign in</b><label>Admin password<input id="pw" type="password" autocomplete="current-password" required></label><button class="btn" id="li">Sign in</button><p class="msg" id="a-msg"></p></form></section></main>`;
 return head+`<main class="w"><section><div class="tabs" id="at">${[["fixtures","Fixtures"],["news","News"],["teams","Teams"],["players","Players"],["site","Banners"]].map(([k,l])=>`<button role="tab" data-k="${k}" aria-selected="${AT===k}">${l}</button>`).join("")}${MODE==="live"?'<button id="so" style="margin-left:auto;border-color:var(--line)">Sign out</button>':""}</div><div id="ad"></div></section></main>`}
};

/* ---------- admin ---------- */
const teamOpts=()=>teams().map(t=>[t.id,t.name]);
const sel=(k,o,x)=>`<select data-k="${k}">${o.map(([i,n])=>`<option value="${esc(i)}" ${x===i?"selected":""}>${esc(n)}</option>`).join("")}</select>`;
const fld=([k,l,t,o],v)=>{const x=v[k]??"";return `<label>${l}${t==="team"?sel(k,teamOpts(),x):t==="sel"?sel(k,o,x):t==="area"?`<textarea data-k="${k}">${esc(x)}</textarea>`:`<input data-k="${k}" type="${t==="num"?"number":t}" ${t==="num"?'min="0" max="99" step="1"':""} value="${esc(x)}">`}</label>`};
const rid=p=>p+Date.now().toString(36)+Math.random().toString(36).slice(2,5);
const FORMS={
 fixtures:{col:"fixtures",one:"fixture",f:[["home","Home team","team"],["away","Away team","team"],["date","Date","date"],["time","Kick-off","time"],["venue","Venue","text"],["hg","Home goals (blank until played)","num"],["ag","Away goals","num"]],
  def:()=>({time:"09:00",venue:V,home:teams()[0]?.id,away:teams()[1]?.id}),src:()=>[...D.fixtures].sort(byTime).reverse(),lab:f=>`${T(f.home).short} ${played(f)?f.hg+"-"+f.ag:"v"} ${T(f.away).short} (${fmtDay(f.date)})`,
  chk:v=>!v.date?"Pick a date.":!v.home||!v.away||v.home===v.away?"Pick two different teams.":(v.hg===null)!==(v.ag===null)?"Fill in both scores or neither.":"",id:v=>rid("f")},
 news:{col:"news",one:"article",f:[["title","Title","text"],["tag","Tag (e.g. Report, Notice)","text"],["date","Date","date"],["color","Colour","color"],["summary","Summary (one or two lines)","text"],["body","Article (leave a blank line between paragraphs)","area"]],
  def:()=>({tag:"News",color:"#ff5a1f",date:new Date().toISOString().slice(0,10)}),src:newsList,lab:n=>n.title,chk:v=>v.title?"":"Add a title.",id:v=>(v.title.toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"").slice(0,40)||"post")+"-"+Date.now().toString(36).slice(-4)},
 teams:{col:"teams",one:"team",f:[["name","Team name","text"],["short","Short name (3 letters)","text"],["c","Colour","color"],["manager","Manager","text"],["ground","Home ground","text"],["ord","Table order (0 first)","num"],["badge","Badge image (URL or /badges/name.png)","text"],["theme","Card style","sel",[["","Standard"],["civo","Civo: black and gold"],["avenue","2nd Avenue: red and white"],["baraka","Baraka: yellow and black"],["samba","Samba Boys: monochrome"],["elland","Elland: stadium blue"]]],["bio","About the team","area"]],
  def:()=>({c:"#1971c2",ground:V,ord:D.teams.length}),src:teams,lab:t=>t.name,chk:v=>!v.name?"Add a team name.":!v.short?"Add a short name.":"",id:v=>rid("t")},
 players:{col:"players",one:"player",f:[["team","Team","team"],["name","Player name","text"],["num","Shirt number (0-99)","num"],["pos","Position","sel",POS.map(([k,l])=>[k,l.replace(/s$/,"")])]],
  def:()=>({team:PT||teams()[0]?.id,pos:"MID"}),src:()=>D.players.filter(p=>p.team===PT).sort((a,b)=>(a.num??999)-(b.num??999)),lab:p=>`${p.num??"–"}  ${p.name} (${p.pos})`,
  chk:v=>!v.team?"Pick a team.":!v.name?"Add the player's name.":v.num!==null&&v.num>99?"Shirt numbers run 0 to 99.":v.num!==null&&D.players.some(p=>p.team===v.team&&p.num===v.num&&p.id!==EID)?"That shirt number is already taken in this team.":"",id:v=>rid("p")}};
function adminTab(){const k=AT,A=$("#ad");
 if(k==="site"){const s=D.site,a=s.ann||{},p=s.promo||{};
  A.innerHTML=`<div class="ed" style="max-width:640px"><b>Announcement bar</b><label>Text<input id="s-at" value="${esc(a.text)}"></label><div class="g2"><label>Link<input id="s-al" value="${esc(a.link)}"></label><label>Button text<input id="s-ab" value="${esc(a.label)}"></label></div><label class="row"><input type="checkbox" id="s-ao" ${a.on?"checked":""} style="width:auto"> Show the bar</label>
  <b>Home page promo</b><label>Title<input id="s-pt" value="${esc(p.title)}"></label><label>Text<input id="s-px" value="${esc(p.text)}"></label><div class="g2"><label>Link<input id="s-pl" value="${esc(p.link)}"></label><label>Button text<input id="s-pb" value="${esc(p.label)}"></label><label>Big label<input id="s-pg" value="${esc(p.big)}"></label></div><label class="row"><input type="checkbox" id="s-po" ${p.on?"checked":""} style="width:auto"> Show the promo</label>
  <label>Scrolling ribbon text (blank hides it)<input id="s-rb" value="${esc(s.ribbon)}"></label><div class="row"><button class="btn" id="s-save">Save banners</button></div><p class="msg" id="a-msg"></p></div>`;
  $("#s-save").onclick=()=>run(async()=>{await putSite({ann:{on:$("#s-ao").checked,text:$("#s-at").value,link:$("#s-al").value,label:$("#s-ab").value},promo:{on:$("#s-po").checked,title:$("#s-pt").value,text:$("#s-px").value,link:$("#s-pl").value,label:$("#s-pb").value,big:$("#s-pg").value},ribbon:$("#s-rb").value});ann()},"Saved.");return}
 const F=FORMS[k];if(k==="players"&&!PT)PT=teams()[0]?.id;
 A.innerHTML=`<div class="cols"><form class="ed" id="ef" onsubmit="return false"><b id="e-h"></b><div class="g2" id="e-f"></div><div class="row"><button class="btn" id="e-save">Save</button><button class="btn o" id="e-new" type="button">Clear form</button></div><p class="msg" id="a-msg"></p></form><div class="ed"><b>${{fixtures:"All fixtures",news:"All articles",teams:"All teams",players:"Squad"}[k]}</b>${k==="players"?`<label>Team<select id="pt">${teams().map(t=>`<option value="${esc(t.id)}" ${PT===t.id?"selected":""}>${esc(t.name)}</option>`).join("")}</select></label>`:""}<div id="al"></div></div></div>`;
 $("#e-new").onclick=()=>edit(null);$("#e-save").onclick=save;if($("#pt"))$("#pt").onchange=e=>{PT=e.target.value;edit(null);adminList()};edit(null);adminList()}
function edit(id){const F=FORMS[AT],v=id?(F.src().find(x=>x.id===id)||{}):F.def();EID=id;$("#e-h").textContent=(id?"Edit ":"New ")+F.one;
 $("#e-f").innerHTML=F.f.map(f=>fld(f,v)).join("");$("#e-f").querySelectorAll("textarea,[data-k=title],[data-k=summary],[data-k=name]").forEach(e=>e.parentNode.style.gridColumn="1/-1")}
function adminList(){const L=$("#al");if(!L)return;const F=FORMS[AT];if(!F)return;const s=F.src();
 L.innerHTML=s.map(x=>`<div class="eli"><b>${esc(F.lab(x))}</b><button data-e="${esc(x.id)}">Edit</button>${AT==="teams"?"":`<button data-x="${esc(x.id)}">Delete</button>`}</div>`).join("")||`<p class="hint">Nothing here yet.</p>`;
 L.querySelectorAll("[data-e]").forEach(b=>b.onclick=()=>edit(b.dataset.e));
 L.querySelectorAll("[data-x]").forEach(b=>b.onclick=()=>{if(confirm("Delete this "+F.one+"?"))run(async()=>{await del(F.col,b.dataset.x);if(EID===b.dataset.x)edit(null);adminList()},"Deleted.")})}
function save(){const F=FORMS[AT],v={};F.f.forEach(([k,,t])=>{const e=$(`#e-f [data-k=${k}]`);v[k]=t==="num"?(e.value===""?null:Math.max(0,parseInt(e.value,10)||0)):e.value.trim()});
 const err=F.chk(v);if(err){$("#a-msg").textContent=err;return}if(AT==="news")v.tag=v.tag||"News";if(AT==="teams"&&v.ord===null)v.ord=0;
 const id=EID||F.id(v);run(async()=>{await put(F.col,id,v);if(AT==="players"){PT=v.team;const p=$("#pt");if(p)p.value=PT}edit(null);adminList()},"Saved.")}
async function run(fn,ok){const m=$("#a-msg");try{if(m)m.textContent="Saving...";await fn();if($("#a-msg"))$("#a-msg").textContent=ok}catch(e){if($("#a-msg"))$("#a-msg").textContent="Couldn't save: "+(e&&e.message||"try again")}}

/* ---------- router ---------- */
const rm=matchMedia("(prefers-reduced-motion:reduce)").matches;
function after(r){
 if(r==="matches"){const draw=()=>{const ok=m=>!MF||m.home===MF||m.away===MF;$("#ml").innerHTML=grouped((MV==="fx"?upcoming():results()).filter(ok))};
  document.querySelectorAll(".tabs button").forEach(b=>b.onclick=()=>{MV=b.dataset.v;document.querySelectorAll(".tabs button").forEach(x=>x.setAttribute("aria-selected",x===b));draw()});$("#tf").onchange=e=>{MF=e.target.value;draw()};draw()}
 if(r==="admin"&&MODE==="live"){
  if(!canEdit()){$("#lf").onsubmit=async e=>{e.preventDefault();const m=$("#a-msg");m.textContent="Signing in...";try{const j=await api("POST","/login",{password:$("#pw").value});setTok(j.token);route(false)}catch(x){m.textContent=x.message}}}
  else{document.querySelectorAll("#at button[data-k]").forEach(b=>b.onclick=()=>{AT=b.dataset.k;document.querySelectorAll("#at button[data-k]").forEach(x=>x.setAttribute("aria-selected",x===b));adminTab()});
   if($("#so"))$("#so").onclick=()=>{setTok(null);route(false)};adminTab()}}}
function route(vt=true){const [r,a]=(location.hash.replace(/^#\/?/,"")||"home").split("/");
 const html=MODE==="error"&&r!=="admin"?P.down():r==="news"&&a?P.article(a):r==="team"?P.team(a):(P[r]||P.home)();const key=r==="team"?"teams":r;
 const apply=()=>{const y=scrollY;$("#app").innerHTML=html;document.querySelectorAll("#nv a").forEach(x=>x.classList.toggle("on",x.dataset.r===key));scrollTo(0,vt?0:y);after(r);
  document.querySelectorAll("tr[data-go]").forEach(tr=>tr.onclick=()=>location.hash=tr.dataset.go)};
 if(vt&&document.startViewTransition&&!rm)document.startViewTransition(apply);else{if(vt)document.documentElement.classList.add("novt");apply()}}
function ann(){const a=D.site.ann,e=$("#ann");if(a&&a.on&&a.text){e.hidden=false;e.innerHTML=`${esc(a.text)} ${a.label?`<a href="${esc(a.link)}">${esc(a.label)}</a>`:""}<button aria-label="Dismiss" onclick="this.parentNode.hidden=true">&times;</button>`}else e.hidden=true}
function changed(){ann();if((location.hash.replace(/^#\/?/,"")||"home").split("/")[0]==="admin"&&canEdit()&&$("#ad")){adminList();return}route(false)}
addEventListener("hashchange",()=>route(true));
/* load: real backend if it answers, otherwise demo data */
(async()=>{try{const d=await api("GET","/data");if(!Array.isArray(d.teams))throw 0;D={teams:d.teams,fixtures:d.fixtures||[],news:d.news||[],players:d.players||[],site:{...DEF.site,...(d.site||{})}};MODE="live";if(TOKEN){try{await api("GET","/me")}catch(e){if(e.status===401)setTok(null)}}}
 catch(e){if(e&&e.status>=500){MODE="error";D={teams:[],fixtures:[],news:[],players:[],site:{}}}
  else{D={teams:DEF.teams,fixtures:DEF.fixtures,news:DEF.news,players:DEF.players,site:DEF.site};MODE="demo"}}
 $("#adl").hidden=MODE!=="live";ann();route(true)})();
</script>
</body>
</html>
